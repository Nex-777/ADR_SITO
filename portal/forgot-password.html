<!DOCTYPE html>
<html class="dark" lang="it">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>ADRENALINA CLUB - RECUPERO PASSWORD</title>
    <meta name="description" content="Recupera la password del tuo account Adrenalina Club."/>
    
    <!-- Scripts & Frameworks -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js" integrity="sha384-d+vyQ0dYcymoP8ndq2hW7FGC50nqGdXUEgoOUGxbbkAJwZqL7h+jKN0GGgn9hFDS" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.43.4/dist/umd/supabase.js" integrity="sha384-mI9wtY/Ee/wUkpbXE5/9Sb1NlGeIk5Ud9UBi2PSjZda46LRo1c8K+KD0Sdufrp7R" crossorigin="anonymous"></script>
    <script src="config.js"></script>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Syncopate:wght@400;700&family=Manrope:wght@200;400;600;800&family=Inter:wght@400;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#df293e",
                        "primary-dim": "#b91c1c",
                        "background": "#0e0e0e",
                        "surface": "#0e0e0e",
                        "surface-container": "#1a1a1a",
                        "surface-container-high": "#20201f",
                        "surface-container-low": "#131313",
                        "on-surface": "#ffffff",
                        "on-surface-variant": "#a3a3a3",
                    },
                    fontFamily: {
                        headline: ["Orbitron", "sans-serif"],
                        label: ["Syncopate", "sans-serif"],
                        body: ["Manrope", "sans-serif"],
                    }
                }
            }
        };
    </script>
    
    <style>
        body {
            font-family: 'Manrope', sans-serif;
            background-color: #0e0e0e;
            color: #ffffff;
        }
        .font-headline { font-family: 'Orbitron', sans-serif; }
        .font-label { font-family: 'Syncopate', sans-serif; }
        
        .brutalist-input {
            background-color: rgba(255, 255, 255, 0.02) !important;
            background: rgba(255, 255, 255, 0.02) !important;
            border: none !important;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1) !important;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            font-size: 1.1rem;
            padding: 0.8rem 0.5rem;
            color: white !important;
            width: 100%;
        }
        
        .brutalist-input:focus {
            outline: none !important;
            border-bottom: 2px solid #df293e !important;
            padding-left: 1rem;
            background-color: rgba(223, 41, 62, 0.05) !important;
        }

        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active {
            -webkit-background-clip: text;
            -webkit-text-fill-color: #ffffff !important;
            transition: background-color 5000s ease-in-out 0s;
            box-shadow: inset 0 0 20px 20px #0e0e0e !important;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between bg-background text-on-surface">

    <!-- Header -->
    <header class="border-b border-white/10 py-6 px-6 bg-black">
        <div class="max-w-[1920px] mx-auto flex justify-between items-center">
            <div class="flex items-center gap-4">
                <a href="../index.html" class="flex items-center gap-3 group">
                    <img src="../assets/logo_icon.png" alt="Icon" class="h-8 w-auto object-contain">
                    <img src="../assets/logo.png" alt="ADRENALINA CLUB" class="h-5 object-contain hidden sm:block">
                </a>
                <span class="text-[10px] font-mono font-bold tracking-widest text-primary border border-primary/40 px-2 py-0.5 rounded-sm uppercase select-none shrink-0 self-center">Vs. 1.00.71</span>
            </div>
            <a href="login.html" class="border border-white/20 text-gray-400 hover:text-white px-4 py-2 text-xs font-headline uppercase tracking-wider transition-all">
                ACCEDI
            </a>
        </div>
    </header>

    <!-- Main Section -->
    <main class="flex-grow flex items-center justify-center p-6">
        <div class="max-w-md w-full border border-white/10 bg-black/40 p-8 space-y-6">
            <div class="text-center space-y-2">
                <span class="font-label text-primary font-bold text-[10px] tracking-widest block uppercase">ADRENALINA PORTAL</span>
                <h2 class="font-headline text-2xl font-black uppercase text-white tracking-wider">RECUPERO PASSWORD</h2>
                <p class="text-xs text-gray-500 uppercase">Inserisci la tua email per ricevere il link di ripristino</p>
            </div>

            <!-- Forgot Password Form -->
            <form id="forgot-form" class="space-y-4">
                <div class="group">
                    <label class="block font-headline text-[9px] font-bold text-white uppercase mb-1">INDIRIZZO EMAIL *</label>
                    <input type="email" id="email" class="w-full brutalist-input" placeholder="esempio@email.com" required>
                </div>

                <div id="message" class="text-xs font-bold uppercase hidden"></div>

                <button type="submit" id="submit-btn" class="w-full bg-white text-black font-headline font-black py-4 uppercase tracking-wider hover:bg-primary hover:text-white transition-all active:scale-[0.98] flex justify-between items-center px-6">
                    INVIA LINK
                    <span class="material-symbols-outlined text-xl">send</span>
                </button>
            </form>

            <div class="text-center mt-4">
                <a href="login.html" class="text-[10px] font-bold text-gray-400 hover:text-white uppercase transition-colors">TORNA ALLA SCHERMATA DI ACCESSO</a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-black w-full border-t border-white/10 py-6 px-6">
        <div class="max-w-[1920px] mx-auto text-center text-[10px] uppercase text-gray-600 tracking-wider">
            © 2026 ASD ADRENALINA CLUB APS.
        </div>
    </footer>

    <!-- Script Logic -->
    <script>
        if (typeof APP_CONFIG === 'undefined') {
            window.APP_CONFIG = {
                SUPABASE_URL: "https://zpategmkelqmexetpaot.supabase.co",
                SUPABASE_KEY: "sb_publishable_hiNKo7e_8AKZm64nWou6zQ_YtSOaGQF",
                API_BASE_URL: "https://portal.adrenalinaclub.it",
                VERSION: "1.00.71"
            };
        }
        const supabaseClient = window.supabase.createClient(APP_CONFIG.SUPABASE_URL, APP_CONFIG.SUPABASE_KEY);

        const form = document.getElementById('forgot-form');
        const messageEl = document.getElementById('message');
        const btn = document.getElementById('submit-btn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            messageEl.classList.add('hidden');
            
            // UI feedback
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = `ATTENDERE... <span class="material-symbols-outlined text-xl">hourglass_empty</span>`;

            const email = document.getElementById('email').value.trim();
            // Build absolute URL for redirection
            const resetUrl = window.location.origin + window.location.pathname.replace('forgot-password.html', 'reset-password.html');

            try {
                const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
                    redirectTo: resetUrl
                });

                if (error) throw error;

                messageEl.textContent = "SE L'EMAIL È REGISTRATA NEL SISTEMA, RICEVERAI UN LINK PER IMPOSTARE LA TUA PASSWORD ENTRO POCHI MINUTI.";
                messageEl.className = 'text-xs text-green-500 font-bold uppercase';
                
            } catch (err) {
                console.error("Reset password error:", err);
                messageEl.textContent = "SI È VERIFICATO UN ERRORE DURANTE L'INVIO. RIPROVA PIÙ TARDI.";
                messageEl.className = 'text-xs text-primary font-bold uppercase';
            } finally {
                messageEl.classList.remove('hidden');
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        });
    </script>
</body>
</html>
