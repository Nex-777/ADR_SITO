name: CSEN Active Sync

on:
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-csen-sync]
  schedule:
    - cron: '0 0 * * *' # Ogni notte alle 00:00 UTC (02:00 ora italiana CEST)

jobs:
  sync_csen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Debug - Verifica ambiente
        run: |
          echo "Node: $(node --version)"
          echo "NPM: $(npm --version)"
          echo "CSEN_USER set: ${{ secrets.CSEN_USER != '' }}"
          echo "SUPABASE_URL set: ${{ secrets.SUPABASE_URL != '' }}"
          echo "Playwright chromium check:"
          npx playwright install --dry-run chromium || echo "Playwright check done"

      - name: Esegui Sincronizzazione CSEN (nuovi tesserati + rinnovi)
        env:
          CSEN_USER: ${{ secrets.CSEN_USER }}
          CSEN_PASS: ${{ secrets.CSEN_PASS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CAPTCHA_API_KEY: ${{ secrets.CAPTCHA_API_KEY }}
        run: node scripts/csen_sync_active.js

      - name: Esegui Riconciliazione ed Auto-Healing
        if: always()
        env:
          CSEN_USER: ${{ secrets.CSEN_USER }}
          CSEN_PASS: ${{ secrets.CSEN_PASS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: node scripts/csen_reconciliation.js

      - name: Aggiorna Contatori Tessere Residue
        if: always()
        env:
          CSEN_USER: ${{ secrets.CSEN_USER }}
          CSEN_PASS: ${{ secrets.CSEN_PASS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: node scripts/scraper_csen.js

      - name: Salva Screenshot e Log di Errore
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: csen-error-debug
          path: |
            csen_error_*.png
            csen_page_source.html

